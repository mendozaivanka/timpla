name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: web/.node-version, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Pull the pinned data release and write latest.json
        run: scripts/data-pull.sh
      - run: npm ci && npm run build
        working-directory: web
        env: { SITE_URL: "https://mendozaivanka.github.io", BASE_PATH: "/timpla" }
      - name: Size guard (GitHub Pages limit is 1 GB)
        run: |
          size=$(du -sm web/dist | cut -f1); echo "dist is ${size} MB"; [ "$size" -lt 900 ]
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: web/dist }
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
